# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Raised from the Android Studio template default of -Xmx2048m (issue #162).
#
# lint runs INSIDE this daemon process -- AndroidLintWorkAction goes through
# NoIsolationWorkerFactory -- while org.gradle.parallel fans Kotlin compilation
# across every module, on 20 logical cores. Under that load the Kotlin Analysis
# API's lazy FIR resolution crashed lintAnalyze*UnitTest intermittently, on a
# different module and a different file each time.
#
# 4g is the low end of the 4/6/8 GB range Android recommends for a large
# project. It is not 6g because this machine has 15.6 GB total and the Kotlin
# and KSP daemons need their own room alongside it.
#
# MaxMetaspaceSize is NOT optional here. Android's build documentation warns
# that setting org.gradle.jvmargs at all can produce `Daemon disappeared`
# failures (Gradle issue #19750) unless MaxMetaspaceSize and
# HeapDumpOnOutOfMemoryError are set explicitly. The previous line set jvmargs
# without either, which is exactly the configuration that warning describes.
# FIR analysis is class-loading heavy, so metaspace is the likelier pressure
# point of the two.
#
# HeapDumpOnOutOfMemoryError buys evidence rather than speed: if #162 recurs,
# the next occurrence leaves a heap dump instead of another guess.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Enables the Gradle build cache, so task outputs can be reused across builds.
org.gradle.caching=true
# Runs independent tasks in parallel across subprojects.
org.gradle.parallel=true
# Avoids generating transitive R classes, so each module only sees its own resources.
android.nonTransitiveRClass=true
# Uses non-final resource IDs, required alongside non-transitive R classes.
android.nonFinalResIds=true
# AGP 9.3's built-in Kotlin compiler rejects KSP registering its generated source directories via
# the `kotlin.sourceSets` DSL (see https://developer.android.com/r/tools/built-in-kotlin). The
# classic Kotlin Gradle plugin is not compatible with AGP 9.3.1's new DSL types either, so built-in
# Kotlin stays on and this suppression lets KSP (needed by Hilt/Room) keep registering its sources.
android.disallowKotlinSourceSets=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
