name: Bug Report
description: Report a defect in PetMePhone
title: "fix(scope): "
labels: ["bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What is broken?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include stack traces or error output if available.
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "e.g. Android 14 (API 34)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / emulator
      placeholder: "e.g. Pixel 7 physical, or Pixel 6 API 34 emulator"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Floating overlay
        - Main app (full screen)
        - Background service / worker
        - Notifications
        - Build / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logcat output
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
