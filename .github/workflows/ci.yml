name: CI

on:
  push:
    branches: [master]
  pull_request:

# This workflow builds and tests. It never writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must match gradle/gradle-daemon-jvm.properties (toolchainVersion=25).
      # If they diverge, Gradle downloads a toolchain mid-build instead of
      # using the one already on the runner.
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      # compileSdk is 37. Hosted runner images lag behind recent API levels,
      # so install it explicitly rather than hoping it is preinstalled.
      #
      # The package is `android-37.0`, with the decimal. API levels gained a
      # minor component, and `platforms;android-37` does not resolve — the
      # first run of this workflow failed on exactly that.
      #
      # Build-tools 36.0.0 matches what a working local build uses; AGP does
      # not require a build-tools version matching compileSdk.
      - name: Install Android SDK platform
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      # Cheap, and it makes any future "package not found" self-diagnosing
      # instead of sending someone back here to guess at names.
      - name: Record installed SDK packages
        if: always()
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --list_installed || true

      # Handles wrapper validation, cache keys and write-back on the default
      # branch only. Do not replace with a hand-rolled actions/cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # One invocation, one daemon session, debug variant only.
      #
      # Deliberately NOT `./gradlew build`: that includes assembleRelease,
      # and there is no signing configuration yet.
      #
      # Deliberately NOT `--no-daemon`: that advice predates setup-gradle,
      # which manages the daemon lifecycle and reuses it across these tasks.
      # `assembleDebugAndroidTest` compiles the instrumented sources without needing a device.
      # It is here because `testDebugUnitTest` never compiles the androidTest source set, so a
      # constructor change three PRs earlier left PetOverlayRendersTest broken and nothing said so.
      # Compiling is cheap; discovering the rot at the moment you finally have an emulator is not.
      #
      # `:core:domain:test` is listed separately because that module is plain JVM, not Android: it
      # has a `test` task and no `testDebugUnitTest`, so the Android-shaped name silently skipped it
      # and only its compile tasks ever ran here. Its unit tests had never executed in CI — in the
      # module that holds the state resolver, the sprite grid arithmetic and the animation pacing.
      # Any future plain-JVM module needs adding to this line for the same reason.
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest :core:domain:test assembleDebugAndroidTest lintDebug --stacktrace

      # Uploaded on success too. Lint warnings do not fail the build, so the
      # report is the only way to see them.
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14
